        .header-text { text-align: left; }
        .header h1 { font-size: 1.6em; margin-bottom: 4px; line-height: 1.2; }
        .header p { font-size: 1em; opacity: 0.9; margin: 0; }

            max-width: 700px;
            margin: -25px auto 20px;
            padding: 0 15px;
            position: relative;
            z-index: 10;
        }
        .search-box input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);

            transition: box-shadow 0.3s;
        }
        .search-box input:focus { box-shadow: 0 4px 30px rgba(102, 126, 234, 0.4); }
        .search-icon {
            position: absolute;
            left: 35px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3em;
        }

        .filters {
            max-width: 1200px;
            margin: 0 auto 25px;
            padding: 0 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;

        .filter-btn:hover { background: #667eea; color: white; }
        .filter-btn.active { background: #667eea; color: white; }

        .counter {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .cards-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px 40px;
            display: grid;

            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.12);
        }
        .card-category {

            letter-spacing: 1px;
            color: #667eea;
            margin-bottom: 6px;

            font-weight: 700;

            color: #555;
            flex-grow: 1;

        }

            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            text-align: center;

        .card[data-cat="go-getter"] .card-category { color: #2ecc71; }
        .card[data-cat="games"] { border-left-color: #3498db; }
        .card[data-cat="games"] .card-category { color: #3498db; }
        .card[data-cat="reading-phonics"] { border-left-color: #9b59b6; }
        .card[data-cat="reading-phonics"] .card-category { color: #9b59b6; }
        .card[data-cat="grammar"] { border-left-color: #1abc9c; }

        .card[data-cat="marathons"] { border-left-color: #e67e22; }

            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.2em;
            display: none;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #aaa;
            font-size: 0.9em;
        }

let currentSearch = '';

function initUI() {
    // Собираем все уникальные теги из ваших данных
    const allTags = new Set();
    allPosts.forEach(p => p.categories.forEach(c => allTags.add(c)));
    
    const filtersEl = document.getElementById('filters');
    let filtersHtml = `<button class="filter-btn active" data-tag="all">✨ Все</button>`;
    Array.from(allTags).sort().forEach(tag => {
        filtersHtml += `<button class="filter-btn" data-tag="${tag}">${tag}</button>`;
    });
    filtersEl.innerHTML = filtersHtml;

    document.getElementById('searchInput').addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase();
        renderPosts();
    });
    
    filtersEl.addEventListener('click', e => {
        if (!e.target.classList.contains('filter-btn')) return;
        currentTag = e.target.dataset.tag;
        filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        renderPosts();
    });

    renderPosts();
}

function renderPosts() {
    const grid = document.getElementById('cardsContainer');
    grid.innerHTML = '';
    const noResults = document.getElementById('noResults');
    
    const filtered = allPosts.filter(post => {
        const matchesTag = currentTag === 'all' || post.categories.includes(currentTag);
        const matchesSearch = currentSearch === '' || 
                              post.text.toLowerCase().includes(currentSearch) || 
                              post.categories.some(c => c.toLowerCase().includes(currentSearch));
        return matchesTag && matchesSearch;
    });

    // Обновление счетчика (размещение как в vkdonat.html)
    document.getElementById('counter').textContent = `Показано материалов: ${filtered.length} из ${allPosts.length}`;

    if (filtered.length === 0) {
        noResults.style.display = 'block';
        return;
    }
    
    noResults.style.display = 'none';

    filtered.forEach(post => {
        const card = document.createElement('div');
        card.className = 'card';
        
        let title = post.text.substring(0, 80);
        if (post.text.length > 80) {
            const lastSpace = title.lastIndexOf(' ');
            if (lastSpace > 40) title = title.substring(0, lastSpace);
            title += '...';
        }
        
        // Первая категория идет как главный заголовок (с цветным акцентом слева)
        const mainCat = post.categories[0] || 'Other';
        const otherCats = post.categories.slice(1);
        const catSlug = mainCat.toLowerCase().replace(/\s+/g, '-').replace(/&/g, 'and');
        card.setAttribute('data-cat', catSlug);
        
        // Остальные категории отображаются как дополнительные теги
        let tagsHtml = '';
        if (otherCats.length > 0) {
            tagsHtml = `<div class="card-tags">${otherCats.map(c => `<span class="card-tag">${c}</span>`).join('')}</div>`;
        }

        card.innerHTML = `
            <div class="card-top">
                <div class="card-top-text">
                    <div class="card-category">${mainCat}</div>
                    ${tagsHtml}
                    <div class="card-title">${title}</div>
                </div>
            </div>
            <div class="card-desc">${post.text}</div>
            <a href="${post.link}" target="_blank" class="card-link">Открыть пост в VK</a>
        `;
        grid.appendChild(card);
    });
}
