<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разработки — Мой удивительный английский</title>
  <meta name="description" content="Каталог авторских материалов для преподавателей и репетиторов английского.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="catalog">
<header id="header" class="header"></header>

<main>
  <section class="page-head">
    <div class="container">
      <h1>Разработки</h1>
      <p>Авторские материалы для преподавателей и репетиторов: видеобуки, игры, рабочие листы и наглядность. Заказ — в нашем магазине ВКонтакте.</p>
    </div>
  </section>

  <section class="section">
    <div class="container catalog-layout">
      <aside class="filters">
        <div class="search-bar"><input id="search" type="search" placeholder="Поиск материалов…"></div>
        <div class="filter-box"><h3>Категории</h3><div id="cat-list" class="cat-list"></div></div>
        <div class="filter-box"><h3>Сортировка</h3>
          <select id="sort">
            <option value="new">Сначала новые</option>
            <option value="pop">По популярности</option>
            <option value="price-asc">Цена ↑</option>
            <option value="price-desc">Цена ↓</option>
          </select>
        </div>
        <button id="reset" class="btn btn-ghost btn-sm" style="margin-top:14px">Сбросить фильтры</button>
      </aside>

      <div>
        <!-- Быстрый фильтр по бейджам -->
        <div id="badge-filter" class="chips-row"></div>
        <div class="catalog-top" id="count"></div>
        <div id="grid" class="grid-cards"></div>
        <div id="pagination" class="pagination"></div>
      </div>
    </div>
  </section>
</main>

<!-- Карточка товара -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" aria-label="Закрыть">✕</button>
    <span class="chip" id="m-cat"></span>
    <h2 id="m-title"></h2>
    <div id="m-meta"></div>
    <div class="modal-grid">
      <div class="modal-gallery">
        <img id="m-img" src="" alt="">
        <div class="thumbs" id="m-thumbs"></div>
        <iframe id="m-video" hidden allowfullscreen></iframe>
      </div>
      <div class="modal-info">
        <div id="m-badges"></div>
        <div id="m-desc" class="modal-desc"></div>
        <p class="price" id="m-price" style="font-size:24px"></p>
        <a id="m-buy" class="btn btn-primary" target="_blank" rel="noopener">Приобрести на VK →</a>
      </div>
    </div>
  </div>
</div>

<footer id="footer" class="footer"></footer>
<script src="assets/js/main.js"></script>
</body>
</html>
